version: 3
name: flutter_keycheck
description: Flutter key validation configuration

# Registry configuration
registry:
  type: path
  path: .flutter_keycheck/baseline.json

# Project configuration
project:
  root: .
  include:
    - lib/**/*.dart
    - test/**/*.dart
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/generated/**"

# Scanner configuration
scanner:
  detectors:
    - ConstructorBased
    - StaticFieldBased
    - EnumBased
    - RecordBased
    - ExtensionTypeBased
  
  options:
    deep_scan: true
    follow_imports: true
    detect_semantic_keys: true

# Policy configuration  
policy:
  fail_on_lost: true
  fail_on_rename: false
  fail_on_extra: false
  fail_on_package_missing: false
  fail_on_collision: false
  protected_tags:
    - critical
    - aqa
  max_drift: 10.0

# Reporter configuration
reporter:
  formats:
    - json
    - html
  output_dir: reports

# Rules configuration (legacy format compatibility)
rules:
  - id: missing-keys
    severity: error
  - id: protected-tags
    severity: error
    config:
      tags: [aqa, critical]
