name: CI

on:
  push:
    branches: [main, flutter_keycheck_v3]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  # Dart SDK version constraints
  DART_STABLE: stable
  DART_BETA: beta

jobs:
  # Test & Analyze - Main quality gates
  test-and-analyze:
    name: Test & Analyze (${{ matrix.sdk }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: [stable, beta]
        include:
          - sdk: stable
            run-tests: true
            enforce-formatting: true
            fatal-warnings: true
          - sdk: beta
            run-tests: true
            enforce-formatting: false
            fatal-warnings: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}

      - name: Print Dart version
        run: dart --version

      # Cache dependencies
      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-dart-${{ matrix.sdk }}-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-dart-${{ matrix.sdk }}-
            ${{ runner.os }}-dart-

      - name: Install dependencies
        run: dart pub get

      - name: Verify formatting
        if: matrix.enforce-formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze code (fatal warnings/infos)
        if: matrix.fatal-warnings
        run: dart analyze --fatal-infos --fatal-warnings

      - name: Analyze code (non-fatal)
        if: '!matrix.fatal-warnings'
        run: dart analyze || true

      - name: Run tests
        if: matrix.run-tests
        run: dart test --reporter expanded

      - name: Generate test coverage
        if: matrix.sdk == 'stable'
        run: |
          dart test --coverage=coverage
          dart pub global activate coverage
          dart pub global run coverage:format_coverage \
            --lcov \
            --in=coverage \
            --out=coverage/lcov.info \
            --report-on=lib

      - name: Upload coverage
        if: matrix.sdk == 'stable'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info

  # CLI smoke tests - Verify CLI functionality
  cli-smoke-tests:
    name: CLI Smoke Tests
    runs-on: ubuntu-latest
    needs: test-and-analyze

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-dart-stable-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-dart-stable-

      - name: Install dependencies
        run: dart pub get

      - name: Test CLI help
        run: |
          dart run bin/flutter_keycheck.dart --help
          dart run bin/flutter_keycheck.dart --version

      - name: Test scan command
        run: |
          dart run bin/flutter_keycheck.dart scan --help
          dart run bin/flutter_keycheck.dart scan --project-root example/flutter_casino_demo --dry-run

      - name: Test validate command
        run: |
          dart run bin/flutter_keycheck.dart validate --help

      - name: Global activation test
        run: |
          dart pub global activate --source path .
          flutter_keycheck --version
          flutter_keycheck scan --help

      - name: Compile executable
        run: |
          dart compile exe bin/flutter_keycheck.dart -o flutter_keycheck
          ./flutter_keycheck --version
          ./flutter_keycheck scan --help

  # V3 Commands verification
  v3-commands-verification:
    name: V3 Commands Verification
    runs-on: ubuntu-latest
    needs: test-and-analyze

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-dart-stable-${{ hashFiles('**/pubspec.yaml') }}

      - name: Install dependencies
        run: dart pub get

      - name: Verify scan command implementation
        run: |
          # Test scan with various flags
          dart run bin/flutter_keycheck.dart scan \
            --project-root example/flutter_casino_demo \
            --output-format json \
            --dry-run

      - name: Verify validate command implementation
        run: |
          # Test validate command structure
          dart run bin/flutter_keycheck.dart validate \
            --help

      - name: Test configuration loading
        run: |
          # Create test config
          echo "version: 1.0" > .flutter_keycheck.yaml
          echo "scan:" >> .flutter_keycheck.yaml
          echo "  include:" >> .flutter_keycheck.yaml
          echo "    - '**/*.dart'" >> .flutter_keycheck.yaml

          dart run bin/flutter_keycheck.dart scan \
            --config .flutter_keycheck.yaml \
            --dry-run

          rm .flutter_keycheck.yaml

  # Package quality checks
  package-quality:
    name: Package Quality
    runs-on: ubuntu-latest
    needs: test-and-analyze

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-dart-stable-${{ hashFiles('**/pubspec.yaml') }}

      - name: Install dependencies
        run: dart pub get

      - name: Run pana (pub.dev analysis)
        run: |
          dart pub global activate pana
          dart pub global run pana --no-warning || true

      - name: Verify package constraints
        run: dart pub publish --dry-run

      - name: Check for dependency issues
        run: dart pub deps --no-dev --style=compact
