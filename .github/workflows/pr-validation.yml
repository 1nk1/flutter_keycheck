name: PR Validation

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, flutter_keycheck_v3]

env:
  DART_SDK: stable

jobs:
  # PR Quality Gates - Enforced checks for pull requests
  pr-quality-gates:
    name: PR Quality Gates
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for proper diff

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ env.DART_SDK }}

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-dart-stable-pr-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-dart-stable-

      - name: Install dependencies
        run: dart pub get

      # Mandatory quality checks
      - name: Check formatting (required)
        run: |
          echo "Checking code formatting..."
          dart format --output=none --set-exit-if-changed .

      - name: Analyze code (strict)
        run: |
          echo "Running strict analysis..."
          dart analyze --fatal-infos --fatal-warnings

      - name: Run tests with coverage
        run: |
          echo "Running tests..."
          dart test --reporter expanded --coverage=coverage

      - name: Check test coverage
        run: |
          dart pub global activate coverage
          dart pub global run coverage:format_coverage \
            --lcov \
            --in=coverage \
            --out=coverage/lcov.info \
            --report-on=lib

          # Optional: Add coverage threshold check
          echo "Coverage report generated at coverage/lcov.info"

      - name: Validate CLI commands
        run: |
          echo "Validating v3 CLI commands..."
          dart run bin/flutter_keycheck.dart --version
          dart run bin/flutter_keycheck.dart scan --help
          dart run bin/flutter_keycheck.dart validate --help

      - name: Check package score
        run: |
          echo "Checking package score with pana..."
          dart pub global activate pana
          dart pub global run pana --no-warning --exit-code-threshold 100 || true

      - name: Verify pub.dev readiness
        run: |
          echo "Verifying package is ready for publishing..."
          dart pub publish --dry-run

  # Breaking changes detection
  breaking-changes:
    name: Breaking Changes Detection
    runs-on: ubuntu-latest
    if: github.base_ref == 'main'

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          path: pr

      - name: Checkout base branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.base_ref }}
          path: base

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Check for breaking changes
        run: |
          echo "Checking for potential breaking changes..."

          # Check if version was bumped appropriately
          PR_VERSION=$(grep "^version:" pr/pubspec.yaml | cut -d' ' -f2)
          BASE_VERSION=$(grep "^version:" base/pubspec.yaml | cut -d' ' -f2)

          echo "Base version: $BASE_VERSION"
          echo "PR version: $PR_VERSION"

          # Check for removed or modified public APIs
          echo "Analyzing public API changes..."

          # Check executable changes
          if ! diff -q base/bin/flutter_keycheck.dart pr/bin/flutter_keycheck.dart > /dev/null; then
            echo "⚠️ Changes detected in main executable"
          fi

          # Check for removed exports
          if [ -f base/lib/flutter_keycheck.dart ] && [ -f pr/lib/flutter_keycheck.dart ]; then
            diff base/lib/flutter_keycheck.dart pr/lib/flutter_keycheck.dart || true
          fi

  # Documentation validation
  documentation-check:
    name: Documentation Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check README
        run: |
          if [ ! -f README.md ]; then
            echo "❌ README.md is missing"
            exit 1
          fi
          echo "✅ README.md exists"

      - name: Check CHANGELOG
        run: |
          if [ ! -f CHANGELOG.md ]; then
            echo "❌ CHANGELOG.md is missing"
            exit 1
          fi
          echo "✅ CHANGELOG.md exists"

          # Check if CHANGELOG has entry for current version
          VERSION=$(grep "^version:" pubspec.yaml | cut -d' ' -f2)
          if ! grep -q "## $VERSION" CHANGELOG.md && ! grep -q "## \[$VERSION\]" CHANGELOG.md; then
            echo "⚠️ No CHANGELOG entry found for version $VERSION"
          fi

      - name: Check LICENSE
        run: |
          if [ ! -f LICENSE ]; then
            echo "❌ LICENSE file is missing"
            exit 1
          fi
          echo "✅ LICENSE exists"

      - name: Validate example
        run: |
          if [ -d example ]; then
            echo "✅ Example directory exists"

            # Check if example has its own pubspec.yaml
            if [ -f example/pubspec.yaml ]; then
              echo "✅ Example has pubspec.yaml"
            fi

            # Check if example has a README
            if [ -f example/README.md ]; then
              echo "✅ Example has README.md"
            else
              echo "⚠️ Example is missing README.md"
            fi
          else
            echo "⚠️ No example directory found"
          fi

  # Performance regression check
  performance-check:
    name: Performance Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Cache pub dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-dart-stable-perf-${{ hashFiles('**/pubspec.yaml') }}

      - name: Install dependencies
        run: dart pub get

      - name: Compile executable
        run: dart compile exe bin/flutter_keycheck.dart -o flutter_keycheck

      - name: Performance benchmark
        run: |
          echo "Running performance benchmarks..."

          # Measure CLI startup time
          time ./flutter_keycheck --version

          # Measure scan command on example project
          if [ -d example/flutter_casino_demo ]; then
            echo "Benchmarking scan command..."
            time ./flutter_keycheck scan --project-root example/flutter_casino_demo --output-format json > /dev/null
          fi

          # Check executable size
          SIZE=$(ls -lh flutter_keycheck | awk '{print $5}')
          echo "Executable size: $SIZE"

  # Security scan
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Dart SDK
        uses: dart-lang/setup-dart@v1
        with:
          sdk: stable

      - name: Install dependencies
        run: dart pub get

      - name: Check for dependency vulnerabilities
        run: |
          echo "Checking for known vulnerabilities in dependencies..."
          dart pub deps --json > deps.json

          # Check for outdated dependencies
          dart pub outdated || true

      - name: Scan for secrets
        run: |
          echo "Scanning for potential secrets or sensitive data..."

          # Basic check for common secret patterns
          if grep -r "api[_-]key\|secret\|password\|token" --exclude-dir=.git --exclude-dir=.dart_tool .; then
            echo "⚠️ Potential secrets detected - please review"
          fi || echo "✅ No obvious secrets detected"

  # Summary comment (optional - requires GitHub token with write permissions)
  pr-summary:
    name: PR Summary
    runs-on: ubuntu-latest
    needs: [pr-quality-gates, breaking-changes, documentation-check, performance-check, security-scan]
    if: always()

    steps:
      - name: Summary
        run: |
          echo "## PR Validation Summary"
          echo ""
          echo "### Required Checks"
          echo "- Quality Gates: ${{ needs.pr-quality-gates.result }}"
          echo "- Breaking Changes: ${{ needs.breaking-changes.result }}"
          echo "- Documentation: ${{ needs.documentation-check.result }}"
          echo ""
          echo "### Optional Checks"
          echo "- Performance: ${{ needs.performance-check.result }}"
          echo "- Security: ${{ needs.security-scan.result }}"
