# Flutter Casino Demo - Comprehensive Expected Keys Configuration
# Generated by Flutter KeyCheck Orchestrator for comprehensive validation workflow
# This configuration covers all automation-critical UI elements for QA testing

version: "1.0"
project_name: "flutter_casino_demo"
description: "Premium interactive casino demo with glassmorphism UI - Full key validation"

# Critical keys that MUST be present for automation testing
tracked_keys:
  # Main Navigation & Game Selection
  - key: "slotsGameCard"
    description: "Slots game navigation card"
    category: "navigation"
    priority: "critical"
    test_scenarios: 
      - "Navigate to slots game"
      - "Verify game card visibility"
    
  - key: "rouletteGameCard"
    description: "Roulette game navigation card"
    category: "navigation"
    priority: "critical"
    test_scenarios:
      - "Navigate to roulette game" 
      - "Verify game card visibility"
    
  - key: "blackjackGameCard"
    description: "Blackjack game navigation card"
    category: "navigation"
    priority: "critical"
    test_scenarios:
      - "Navigate to blackjack game"
      - "Verify game card visibility"
    
  - key: "demoModeCard"
    description: "Automated demo mode activation card"
    category: "automation"
    priority: "high"
    test_scenarios:
      - "Start automated demo sequence"
      - "Verify demo mode functionality"

  # Slots Game Critical Actions
  - key: "spinButton"
    description: "Primary slot machine spin action"
    category: "game_action"
    priority: "critical"
    test_scenarios:
      - "Execute slot spin with bet validation"
      - "Verify spin animation and results"
      - "Test multiple consecutive spins"

  # Roulette Game Critical Actions  
  - key: "redBet"
    description: "Red color bet placement button"
    category: "betting"
    priority: "critical"
    test_scenarios:
      - "Place bet on red"
      - "Verify bet amount deduction"
      - "Test bet validation logic"
    
  - key: "blackBet"
    description: "Black color bet placement button" 
    category: "betting"
    priority: "critical"
    test_scenarios:
      - "Place bet on black"
      - "Verify bet amount deduction"
      - "Test bet validation logic"
    
  - key: "spinRouletteButton"
    description: "Roulette wheel spin execution"
    category: "game_action"
    priority: "critical"
    test_scenarios:
      - "Execute roulette spin with active bet"
      - "Verify wheel animation and result"
      - "Test win/loss calculation"

  # Blackjack Game Critical Actions
  - key: "dealButton"
    description: "Initial card dealing action"
    category: "game_action"
    priority: "critical"
    test_scenarios:
      - "Deal initial hand"
      - "Verify card distribution"
      - "Test game state initialization"
    
  - key: "hitButton"
    description: "Hit action - request additional card"
    category: "game_action"
    priority: "critical"
    test_scenarios:
      - "Hit with safe hand value"
      - "Hit resulting in bust"
      - "Test card value calculation"
    
  - key: "standButton"
    description: "Stand action - end player turn"
    category: "game_action"
    priority: "critical"
    test_scenarios:
      - "Stand with various hand values"
      - "Trigger dealer play sequence"
      - "Test game resolution logic"
    
  - key: "newGameButton"
    description: "Initialize new blackjack game"
    category: "game_control"
    priority: "high"
    test_scenarios:
      - "Start new game after completion"
      - "Reset game state properly"
      - "Verify bet carryover logic"

  # Demo & Control System
  - key: "runDemoButton"
    description: "Execute automated demo sequence"
    category: "automation"
    priority: "high"
    test_scenarios:
      - "Run full automated demo"
      - "Verify demo sequence completion"
      - "Test demo interruption handling"
    
  - key: "decreaseBetButton"
    description: "Decrease current bet amount"
    category: "betting_control"
    priority: "medium"
    test_scenarios:
      - "Decrease bet within limits"
      - "Test minimum bet boundary"
      - "Verify balance validation"
    
  - key: "increaseBetButton"
    description: "Increase current bet amount"
    category: "betting_control" 
    priority: "medium"
    test_scenarios:
      - "Increase bet within limits"
      - "Test maximum bet boundary"
      - "Verify balance validation"

# Test Environment Keys (for incremental testing)
optional_keys:
  - key: "incremental_key_1"
    description: "Test widget for incremental development"
    category: "test_utility"
    priority: "low"
    
  - key: "incremental_button"
    description: "Test button for incremental functionality"
    category: "test_utility"
    priority: "low"

# Validation Configuration
validation_rules:
  # All critical keys must be present
  require_all_critical: true
  
  # Allow optional keys to be missing
  allow_missing_optional: true
  
  # Validation categories
  categories:
    critical: "Must be present for basic functionality"
    high: "Important for full feature testing"
    medium: "Useful for comprehensive testing"
    low: "Development/debug utilities"

# Integration Test Scenarios
test_workflows:
  - name: "Complete Casino Gameplay"
    description: "End-to-end casino experience validation"
    required_keys: 
      - "slotsGameCard"
      - "spinButton"
      - "rouletteGameCard"
      - "redBet"
      - "spinRouletteButton"
      - "blackjackGameCard"
      - "dealButton"
      - "hitButton"
      - "standButton"
      
  - name: "Automated Demo Validation"
    description: "Demo mode functionality testing"
    required_keys:
      - "demoModeCard"
      - "runDemoButton"
      
  - name: "Betting System Validation"
    description: "Comprehensive bet control testing"
    required_keys:
      - "decreaseBetButton"
      - "increaseBetButton"
      - "redBet"
      - "blackBet"

# Performance and Quality Targets
quality_targets:
  key_coverage: "100%"  # All tracked keys must be validated
  test_execution_time: "< 60 seconds"
  false_positive_rate: "< 5%"
  automation_reliability: "> 95%"